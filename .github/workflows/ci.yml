name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  cpp-build-and-test:
    name: C++ analysis engine (build + GoogleTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -S analysis-engine -B analysis-engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build analysis-engine/build

      - name: Run tests
        run: ctest --test-dir analysis-engine/build --output-on-failure

  python-test:
    name: Python API service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r api-service/requirements.txt

      - name: Run tests
        working-directory: api-service
        run: pytest -v
